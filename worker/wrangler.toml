name = "potok-agent"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Public, non-secret configuration. Secrets (provider API keys) are set with
#   wrangler secret put GROQ_API_KEY
# and never live in this file.
[vars]
FIREBASE_PROJECT_ID = "neon-extended"

# Which provider answers board mentions. "groq" or "openrouter".
AGENT_PROVIDER = "openrouter"
AGENT_MODEL = "minimax/minimax-m3:free"

# Comma-separated list of origins allowed to call the worker.
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:3001,https://neon-extended.web.app,https://neon-extended.firebaseapp.com"
