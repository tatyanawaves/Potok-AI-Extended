name: Deploy

# Every push to main is tested and put live, in the order that keeps old and
# new code compatible (each step waits for the one before it):
#
#   1. Worker — new endpoints exist before any page calls them.
#   2. Hosting — https://neon-extended.web.app, built with the worker address.
#   3. Firestore rules — last, once the pages that satisfy them are live.
#
# The worker and the rules are deployed only when their files changed (or on
# a manual run). Each step stays inert until its secret is added in
# repository Settings → Secrets and variables → Actions:
#
#   FIREBASE_SERVICE_ACCOUNT_NEON_EXTENDED  JSON key of a service account with
#       "Firebase Hosting Admin" and "Firebase Rules Admin" (Firebase console →
#       Project settings → Service accounts → Generate new private key; add
#       the roles in Google Cloud IAM). Hosting and rules.
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  a token with "Edit Cloudflare
#       Workers" (dash.cloudflare.com → My Profile → API Tokens). Worker.
#
# The worker's own secrets (wrangler secret put …) are not touched here.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys run one after another; a newer one never cancels a deploy midway.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test and see what changed
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.changes.outputs.worker }}
      rules: ${{ steps.changes.outputs.rules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm test

      # The worker bundles the shared runtime (services/), so a change there
      # redeploys it too.
      - name: Changed parts
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "worker=true" >> "$GITHUB_OUTPUT"
            echo "rules=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          echo "$files"
          if echo "$files" | grep -qE '^(worker/|services/|types\.ts)'; then echo "worker=true" >> "$GITHUB_OUTPUT"; else echo "worker=false" >> "$GITHUB_OUTPUT"; fi
          if echo "$files" | grep -qE '^firestore\.rules$'; then echo "rules=true" >> "$GITHUB_OUTPUT"; else echo "rules=false" >> "$GITHUB_OUTPUT"; fi

  worker:
    name: Cloudflare worker
    needs: test
    if: needs.test.outputs.worker == 'true'
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
        working-directory: worker

      - name: Type check
        run: npx tsc --noEmit
        working-directory: worker

      - name: Deploy
        if: env.HAS_KEY == 'true'
        run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: No deploy key yet
        if: env.HAS_KEY != 'true'
        run: echo "::notice::Worker checked, not deployed — add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see the top of deploy.yml)."

  hosting:
    name: Firebase Hosting
    needs: [test, worker]
    # Runs after the worker, or without it when the worker had nothing new.
    if: always() && needs.test.result == 'success' && (needs.worker.result == 'success' || needs.worker.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEON_EXTENDED != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The worker address is public — it ships in the bundle — so a default
      # is kept here; a repository variable of the same name overrides it.
      - name: Build
        run: npm run build
        env:
          VITE_PIPEDREAM_WORKER_URL: ${{ vars.VITE_PIPEDREAM_WORKER_URL || 'https://potok-pipedream.potok.workers.dev' }}

      - name: The bundle knows the worker
        run: grep -q "${{ vars.VITE_PIPEDREAM_WORKER_URL || 'potok-pipedream.potok.workers.dev' }}" dist/assets/*.js

      - name: Deploy to neon-extended.web.app
        if: env.HAS_KEY == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEON_EXTENDED }}
          projectId: neon-extended
          channelId: live

      - name: No deploy key yet
        if: env.HAS_KEY != 'true'
        run: echo "::notice::Built, not deployed — add the FIREBASE_SERVICE_ACCOUNT_NEON_EXTENDED secret to deploy (see the top of deploy.yml)."

  rules:
    name: Firestore rules
    needs: [test, hosting]
    if: always() && needs.hosting.result == 'success' && needs.test.outputs.rules == 'true'
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEON_EXTENDED != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci
      - run: npm install -g firebase-tools

      - name: Rules tests
        run: npm run test:rules

      # The key goes through the environment, never into the command line.
      - name: Deploy
        if: env.HAS_KEY == 'true'
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEON_EXTENDED }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" firebase deploy --only firestore:rules --project neon-extended --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

      - name: No deploy key yet
        if: env.HAS_KEY != 'true'
        run: echo "::notice::Rules tested, not deployed — add the FIREBASE_SERVICE_ACCOUNT_NEON_EXTENDED secret (with the Firebase Rules Admin role)."
