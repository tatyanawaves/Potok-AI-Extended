name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch makes the running job pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Types
        run: npm run typecheck

      - name: Build
        run: npm run build

  worker:
    name: Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks compares against history; a shallow clone hides it.
          fetch-depth: 0

      # This project shipped a live OpenRouter key in a committed source file
      # once already, and being a Vite app it went out in the client bundle.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
